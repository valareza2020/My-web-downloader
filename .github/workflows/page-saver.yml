name: 📸 ذخیره کامل یک صفحه

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'آدرس صفحه مورد نظر'
        required: true
        type: string

jobs:
  save-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip
          npm init -y
          npm install puppeteer

      - name: ساخت اسکریپت اسکرین‌شات
        run: |
          cat > screenshot.js << 'EOF'
          const puppeteer = require('puppeteer');
          const url = process.argv[2];
          const outputPath = process.argv[3];
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });
            await page.screenshot({ path: outputPath, fullPage: true });
            await browser.close();
          })();
          EOF

      - name: ذخیره صفحه و دانلود محتوا
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SAFE_NAME=$(echo "$PAGE_URL" | sed 's|[/:]|_|g' | cut -c1-50)
          OUTPUT_DIR="saved_pages/${SAFE_NAME}_${TIMESTAMP}"
          mkdir -p "$OUTPUT_DIR" "$OUTPUT_DIR/media"

          curl -L -o "$OUTPUT_DIR/page.html" "$PAGE_URL"
          node screenshot.js "$PAGE_URL" "$OUTPUT_DIR/screenshot.png"

          lynx --dump "$OUTPUT_DIR/page.html" > "$OUTPUT_DIR/text.txt" 2>/dev/null || echo "متن یافت نشد" > "$OUTPUT_DIR/text.txt"

          grep -oP 'src="\K[^"]*\.(jpg|jpeg|png|gif|svg|webp)' "$OUTPUT_DIR/page.html" | head -20 | while read img; do
            if [[ "$img" =~ ^http ]]; then url="$img"; else url="https://$(echo "$PAGE_URL" | awk -F/ '{print $3}')$img"; fi
            fname=$(basename "$img" | cut -d'?' -f1)
            curl -L -s -o "$OUTPUT_DIR/media/$fname" "$url"
          done

          cd saved_pages && zip -r "${SAFE_NAME}_${TIMESTAMP}.zip" "${SAFE_NAME}_${TIMESTAMP}" && cd ..

          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV

      - name: آپلود به گیت‌هاب
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add saved_pages/
          git commit -m "ذخیره صفحه: ${{ github.event.inputs.page_url }}" || echo "چیزی برای کامیت نیست"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
