name: 📸 ذخیره کامل یک صفحه (عکس، متن، فایل‌ها + اسکرین‌شات)

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'آدرس صفحه مورد نظر (مثال: https://example.com/page)'
        required: true
        type: string

jobs:
  save-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: 🔄 دریافت کدهای مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 نصب ابزارهای مورد نیاز
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip wget
          npm init -y
          npm install puppeteer

      - name: 🎯 ساخت اسکریپت اسکرین‌شات با Puppeteer
        run: |
          cat > screenshot.js << 'EOF'
          const puppeteer = require('puppeteer');
          const url = process.argv[2];
          const outputPath = process.argv[3];

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            
            try {
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 45000 });
              await page.screenshot({ path: outputPath, fullPage: true });
              console.log('✅ Screenshot saved');
            } catch (err) {
              console.error('❌ Screenshot error:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: 🌐 دریافت و پردازش صفحه
        run: |
          PAGE_URL="${{ github.event.inputs.page_url }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SAFE_NAME=$(echo "$PAGE_URL" | sed 's|[/:]|_|g' | cut -c1-100)
          OUTPUT_DIR="saved_pages/${SAFE_NAME}_${TIMESTAMP}"
          MEDIA_DIR="${OUTPUT_DIR}/media"
          mkdir -p "$OUTPUT_DIR" "$MEDIA_DIR"

          echo "📄 آدرس: $PAGE_URL"
          echo "📁 پوشه خروجی: $OUTPUT_DIR"

          # دانلود HTML صفحه
          echo "⬇️ دانلود HTML صفحه..."
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -o "$OUTPUT_DIR/page.html" "$PAGE_URL"

          # 1. گرفتن اسکرین‌شات کامل
          echo "📸 گرفتن اسکرین‌شات..."
          node screenshot.js "$PAGE_URL" "$OUTPUT_DIR/screenshot.png"
          SCREENSHOT_SUCCESS=$?

          # 2. استخراج متن خالص از HTML (بدون تگ‌ها)
          echo "📝 استخراج متن صفحه..."
          lynx --dump "$OUTPUT_DIR/page.html" > "$OUTPUT_DIR/plain_text.txt" 2>/dev/null || \
          html2text "$OUTPUT_DIR/page.html" > "$OUTPUT_DIR/plain_text.txt" 2>/dev/null || \
          echo "امکان استخراج متن وجود نداشت" > "$OUTPUT_DIR/plain_text.txt"

          # 3. پیدا کردن و دانلود تمام عکس‌ها (img tag)
          echo "🖼️ جستجوی عکس‌ها..."
          grep -oP 'src="\K[^"]*' "$OUTPUT_DIR/page.html" | grep -E '\.(jpg|jpeg|png|gif|svg|webp|bmp|ico)' > "$OUTPUT_DIR/image_urls.txt"
          grep -oP "src='\K[^']*" "$OUTPUT_DIR/page.html" | grep -E '\.(jpg|jpeg|png|gif|svg|webp|bmp|ico)' >> "$OUTPUT_DIR/image_urls.txt"

          IMAGE_COUNT=0
          while IFS= read -r img_url; do
            [ -z "$img_url" ] && continue
            # ساخت آدرس کامل
            if [[ "$img_url" =~ ^http ]]; then
              FULL_URL="$img_url"
            elif [[ "$img_url" =~ ^// ]]; then
              FULL_URL="https:$img_url"
            elif [[ "$img_url" =~ ^/ ]]; then
              DOMAIN=$(echo "$PAGE_URL" | awk -F/ '{print $3}')
              FULL_URL="https://$DOMAIN$img_url"
            else
              BASE=$(echo "$PAGE_URL" | grep -oP '^https?://[^/]+')
              FULL_URL="$BASE/$img_url"
            fi
            
            FILENAME=$(basename "$img_url" | cut -d'?' -f1 | cut -d'#' -f1)
            [ -z "$FILENAME" ] && FILENAME="image_${IMAGE_COUNT}.jpg"
            # جلوگیری از نام تکراری
            [ -f "$MEDIA_DIR/$FILENAME" ] && FILENAME="${TIMESTAMP}_${FILENAME}"
            
            echo "  ⬇️ دانلود: $FILENAME"
            curl -L -s --max-time 30 -o "$MEDIA_DIR/$FILENAME" "$FULL_URL" && \
            [ -s "$MEDIA_DIR/$FILENAME" ] && IMAGE_COUNT=$((IMAGE_COUNT + 1)) || \
            rm -f "$MEDIA_DIR/$FILENAME"
          done < "$OUTPUT_DIR/image_urls.txt"

          # 4. پیدا کردن و دانلود فایل‌های پیوست (از لینک‌های دانلودی)
          echo "📎 جستجوی فایل‌های قابل دانلود..."
          grep -oP 'href="\K[^"]*' "$OUTPUT_DIR/page.html" > "$OUTPUT_DIR/all_links.txt"
          grep -oP "href='\K[^']*" "$OUTPUT_DIR/page.html" >> "$OUTPUT_DIR/all_links.txt"
          
          # فرمت‌های فایل متداول برای دانلود
          DOWNLOAD_EXTS="zip|rar|7z|tar|gz|pdf|doc|docx|xls|xlsx|ppt|pptx|mp3|mp4|mkv|avi|mov|exe|msi|apk|deb|iso"
          
          grep -E "\.($DOWNLOAD_EXTS)(\?|#|$)" "$OUTPUT_DIR/all_links.txt" | sort -u > "$OUTPUT_DIR/file_links.txt"
          
          FILE_COUNT=0
          while IFS= read -r file_url; do
            [ -z "$file_url" ] && continue
            # ساخت آدرس کامل
            if [[ "$file_url" =~ ^http ]]; then
              FULL_URL="$file_url"
            elif [[ "$file_url" =~ ^// ]]; then
              FULL_URL="https:$file_url"
            elif [[ "$file_url" =~ ^/ ]]; then
              DOMAIN=$(echo "$PAGE_URL" | awk -F/ '{print $3}')
              FULL_URL="https://$DOMAIN$file_url"
            else
              BASE=$(echo "$PAGE_URL" | grep -oP '^https?://[^/]+')
              FULL_URL="$BASE/$file_url"
            fi
            
            FILENAME=$(basename "$file_url" | cut -d'?' -f1 | cut -d'#' -f1)
            [ -z "$FILENAME" ] && FILENAME="file_${FILE_COUNT}"
            [ -f "$MEDIA_DIR/$FILENAME" ] && FILENAME="${TIMESTAMP}_${FILENAME}"
            
            echo "  ⬇️ دانلود فایل: $FILENAME"
            curl -L -s --max-time 120 -o "$MEDIA_DIR/$FILENAME" "$FULL_URL" && \
            [ -s "$MEDIA_DIR/$FILENAME" ] && FILE_COUNT=$((FILE_COUNT + 1)) || \
            rm -f "$MEDIA_DIR/$FILENAME"
          done < "$OUTPUT_DIR/file_links.txt"

          # 5. ساخت فایل README (index.md) برای نمایش در گیت‌هاب
          cat > "$OUTPUT_DIR/index.md" << EOF
# 📄 ذخیره شده: $PAGE_URL

**تاریخ:** $(date '+%Y-%m-%d %H:%M:%S')

---

## 📸 اسکرین‌شات کامل صفحه

![اسکرین‌شات](./screenshot.png)

---

## 📝 متن صفحه (متن خالص)

[متن استخراج شده](./plain_text.txt)

---

## 🖼️ عکس‌های دانلود شده ($IMAGE_COUNT عدد)

$(ls "$MEDIA_DIR" | grep -E '\.(jpg|jpeg|png|gif|svg|webp|bmp|ico)' | while read f; do echo "- [$f](./media/$f)"; done || echo "_عکسی یافت نشد_")

---

## 📎 فایل‌های دانلود شده ($FILE_COUNT عدد)

$(ls "$MEDIA_DIR" | grep -vE '\.(jpg|jpeg|png|gif|svg|webp|bmp|ico)' | while read f; do echo "- [$f](./media/$f)"; done || echo "_فایلی یافت نشد_")

---

## 📄 HTML اصلی صفحه

[دانلود page.html](./page.html)

---

## 🔗 تمام لینک‌های موجود در صفحه

[مشاهده همه لینک‌ها](./all_links.txt)

---

*تهیه شده توسط ابزار ذخیره‌ساز اتوماتیک*
EOF

          # 6. ایجاد فایل ZIP نهایی
          echo "📦 ساخت فایل ZIP..."
          cd saved_pages
          zip -r "${SAFE_NAME}_${TIMESTAMP}.zip" "${SAFE_NAME}_${TIMESTAMP}"
          cd ..

          # 7. ذخیره آمار برای مرحله بعد
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo "IMAGE_COUNT=$IMAGE_COUNT" >> $GITHUB_ENV
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

          echo "================================"
          echo "✅ دانلود کامل شد!"
          echo "📸 اسکرین‌شات: $([ $SCREENSHOT_SUCCESS -eq 0 ] && echo 'گرفته شد' || echo 'خطا')"
          echo "🖼️ عکس‌ها: $IMAGE_COUNT عدد"
          echo "📎 فایل‌ها: $FILE_COUNT عدد"
          echo "📦 ZIP: saved_pages/${SAFE_NAME}_${TIMESTAMP}.zip"
          echo "================================"

      - name: 📤 آپلود در گیت‌هاب
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add saved_pages/
          
          if git diff --staged --quiet; then
            echo "هیچ تغییری برای آپلود وجود ندارد"
            exit 0
          fi
          
          git commit -m "✨ ذخیره صفحه: ${{ github.event.inputs.page_url }} | عکس: ${{ env.IMAGE_COUNT }} | فایل: ${{ env.FILE_COUNT }} [skip ci]"
          
          # تلاش برای آپلود با چند بار تکرار
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && \
            echo "✅ آپلود موفقیت‌آمیز بود!" && break || \
            (echo "تلاش $i ناموفق، دوباره سعی می‌شود..." && sleep 5)
          done
